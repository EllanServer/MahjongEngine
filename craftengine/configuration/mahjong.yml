    - {size: "120", width: 1.2}
    - {size: "130", width: 1.3}
    - {size: "140", width: 1.4}
    - {size: "150", width: 1.5}
    - {size: "160", width: 1.6}
    - {size: "170", width: 1.7}
    - {size: "180", width: 1.8}
    - {size: "190", width: 1.9}
    - {size: "200", width: 2.0}
    - {size: "210", width: 2.1}
    - {size: "220", width: 2.2}
  blueprint:
    items:
      mahjongpaper:action_button_hitbox_${size}:
        material: paper
        settings:
          tags:
            - mahjongpaper:action_button_hitbox
        data:
          item_name: "<!i><gray>Mahjong Action Button ${size}</gray>"
        item_model: mahjongcraft:mahjong_tile/back
        behavior:
          type: furniture_item
          rules:
            ground:
              rotation: four
              alignment: center
          furniture:
            behaviors:
              - type: mahjongpaper:managed_scene
            settings:
              item: mahjongpaper:action_button_hitbox_${size}
            variants:
              ground:
                entity_culling:
                  aabb_expansion: 0.25
                  view_distance: 48
                  ray_tracing: true
                elements:
                  - type: item_display
                    item: mahjongpaper:back
                    display_transform: none
                    billboard: fixed
                    position: 0,0,0
                    translation: 0,-16,0
                    shadow_radius: 0
                    shadow_strength: 0
                hitboxes:
                  - type: interaction
                    position: 0,0,0
                    width: "${width}"
                    height: 0.22
                    blocks_building: false
                    interactive: true
                    invisible: true

# Static action text is CE furniture. Labels with semantic arguments remain on the minimal packet
# path because CE 26.8 does not pass furniture context into text replacement.
config_factory#action_labels:
  instances:
    - {key: added_kong}
    - {key: chii}
    - {key: chow}
    - {key: close_reactions}
    - {key: concealed_kong}
    - {key: declare_heavenly_missing}
    - {key: declare_missing}
    - {key: declare_nine_terminals}
    - {key: declare_self_kan}
    - {key: declare_tsumo}
    - {key: direct_kong}
    - {key: discard}
    - {key: discard_riichi}
    - {key: draw}
    - {key: hu}
    - {key: instant_rain}
    - {key: leave}
    - {key: minkan}
    - {key: pass}
    - {key: pon}
    - {key: pung}
    - {key: ready}
    - {key: ron}
    - {key: self_draw_win}
    - {key: settle_exhaustion}
    - {key: skip}
    - {key: start}
    - {key: start_next_hand}
    - {key: transfer_owner_east}
    - {key: transfer_owner_north}
    - {key: transfer_owner_south}
    - {key: transfer_owner_west}
    - {key: unready}
    - {key: view_river}
    - {key: win}
  blueprint:
    items:
      mahjongpaper:action_label_${key}:
        material: paper
        settings:
          tags:
            - mahjongpaper:private_action_label
        data:
          item_name: "<!i><gray>Action Label ${key}</gray>"
        item_model: mahjongcraft:empty
        behavior:
          type: furniture_item
          rules:
            ground:
              rotation: four
              alignment: center
          furniture:
            behaviors:
              - type: mahjongpaper:managed_scene
            settings:
              item: mahjongpaper:action_label_${key}
            variants:
              normal:
                entity_culling:
                  aabb_expansion: 0.25
                  view_distance: 48
                  ray_tracing: true
                elements:
                  - type: text_display
                    text: "<aqua>[<lang:mahjongpaper.action.${key}>]</aqua>"
                    billboard: fixed
                    position: 0,0,0
                    background_color: "#3c000000"
                    text_opacity: -1
                    line_width: 200
                    conditions:
                      - type: mahjongpaper:private_viewer
              emphasized:
                entity_culling:
                  aabb_expansion: 0.25
                  view_distance: 48
                  ray_tracing: true
                elements:
                  - type: text_display
                    text: "<gold>[<lang:mahjongpaper.action.${key}>]</gold>"
                    billboard: fixed
                    position: 0,0,0
                    background_color: "#3c000000"
                    text_opacity: -1
                    line_width: 200
                    conditions:
                      - type: mahjongpaper:private_viewer

