# Every die is a stable CE furniture instance. The two layout families preserve the old centered
# first roll and expand to four dice for MCR's second roll without Java-owned geometry or respawns.
config_factory#opening_dice_slots:
  instances:
    - {slot: 0, single_translation: "-0.11,0.62,0", double_translation: "-0.33,0.62,0", rotation: "0,-8,0"}
    - {slot: 1, single_translation: "0.11,0.62,0", double_translation: "-0.11,0.62,0", rotation: "0,8,0"}
    - {slot: 2, single_translation: "0.11,0.62,0", double_translation: "0.11,0.62,0", rotation: "0,-8,0"}
    - {slot: 3, single_translation: "0.33,0.62,0", double_translation: "0.33,0.62,0", rotation: "0,8,0"}
  blueprint:
    items:
      mahjongpaper:opening_die_slot_${slot}:
