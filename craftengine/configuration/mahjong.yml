# Pinned CraftEngine 26.8 owns static assets, furniture geometry, hitboxes, seats and culling.
# Java selects stable IDs and applies scene diffs; it does not recreate these definitions.

templates:
  mahjongpaper:tile_item:
    material: paper
    settings:
      tags:
        - mahjongpaper:mahjong_tile
    data:
      item_name: "<!i><white>${label}</white>"
    item_model: "mahjongcraft:mahjong_tile/${tile}"

  mahjongpaper:tile_furniture:
    material: paper
    settings:
      tags:
        - mahjongpaper:mahjong_tile_furniture
    data:
      item_name: "<!i><white>${label}</white>"
    item_model: "${model}"
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      furniture:
        behaviors:
          - type: mahjongpaper:managed_scene
        settings:
          item: "${__NAMESPACE__}:${__ID__}"
        variants:
          ground:
            entity_culling:
              aabb_expansion: 0.25
              view_distance: 48
              ray_tracing: true
            elements:
              - type: item_display
                item: "${visual_item}"
                display_transform: head
                billboard: fixed
                position: 0,0,0
                translation: 0,0,0
                rotation: "${rotation}"
                shadow_radius: 0
                shadow_strength: 0

  mahjongpaper:stick_furniture:
    material: paper
    settings:
      tags:
        - mahjongpaper:stick_furniture
    data:
      item_name: "<!i><white>${label}</white>"
    item_model: "${model}"
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      furniture:
        behaviors:
          - type: mahjongpaper:managed_scene
        settings:
          item: "${__NAMESPACE__}:${__ID__}"
        variants:
          ground:
            entity_culling:
              aabb_expansion: 0.25
              view_distance: 48
              ray_tracing: true
            elements:
              - type: item_display
                item: "mahjongpaper:${point}"
                display_transform: none
                billboard: fixed
                position: 0,0,0
                translation: 0,0,0
                rotation: "${rotation}"
                shadow_radius: 0
                shadow_strength: 0

items:
  mahjongpaper:table_visual_model:
    material: paper
    settings:
      tags:
        - mahjongpaper:table_visual
    data:
      item_name: "<!i><gray>Mahjong Table Visual</gray>"
    item_model: mahjongcraft:table_visual

  mahjongpaper:table_visual:
    material: paper
    settings:
      tags:
        - mahjongpaper:table_visual
    data:
      item_name: "<!i><gray>Mahjong Table</gray>"
    item_model: mahjongcraft:table_visual
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      furniture:
        behaviors:
          - type: mahjongpaper:managed_scene
        settings:
          item: mahjongpaper:table_visual
          sounds:
            break: minecraft:block.wood.break
            place: minecraft:block.wood.place
            hit: minecraft:block.wood.hit
        variants:
          ground:
            entity_culling:
              aabb_expansion: 0.25
              view_distance: 48
              ray_tracing: true
            elements:
              - type: item_display
                item: mahjongpaper:table_visual_model
                display_transform: none
                billboard: fixed
                position: 0,0,0
                translation: 0,0,0
                shadow_radius: 0
                shadow_strength: 0
            hitboxes:
              - {position: "-1,-1.5,-1", type: shulker, direction: up, scale: 1, peek: 0, blocks_building: true, interactive: false, interaction_entity: false}
              - {position: "-1,-1.5,0", type: shulker, direction: up, scale: 1, peek: 0, blocks_building: true, interactive: false, interaction_entity: false}
              - {position: "-1,-1.5,1", type: shulker, direction: up, scale: 1, peek: 0, blocks_building: true, interactive: false, interaction_entity: false}
              - {position: "0,-1.5,-1", type: shulker, direction: up, scale: 1, peek: 0, blocks_building: true, interactive: false, interaction_entity: false}
              - {position: "0,-1.5,0", type: shulker, direction: up, scale: 1, peek: 0, blocks_building: true, interactive: false, interaction_entity: false}
              - {position: "0,-1.5,1", type: shulker, direction: up, scale: 1, peek: 0, blocks_building: true, interactive: false, interaction_entity: false}
              - {position: "1,-1.5,-1", type: shulker, direction: up, scale: 1, peek: 0, blocks_building: true, interactive: false, interaction_entity: false}
              - {position: "1,-1.5,0", type: shulker, direction: up, scale: 1, peek: 0, blocks_building: true, interactive: false, interaction_entity: false}
              - {position: "1,-1.5,1", type: shulker, direction: up, scale: 1, peek: 0, blocks_building: true, interactive: false, interaction_entity: false}

  mahjongpaper:hand_tile_hitbox:
    material: paper
    settings:
      tags:
        - mahjongpaper:hand_tile_hitbox
    data:
      item_name: "<!i><gray>Mahjong Action Hitbox</gray>"
    item_model: mahjongcraft:mahjong_tile/back
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      furniture:
        behaviors:
          - type: mahjongpaper:managed_scene
        settings:
          item: mahjongpaper:hand_tile_hitbox
        variants:
          ground:
            entity_culling:
              aabb_expansion: 0.25
              view_distance: 48
              ray_tracing: true
            elements:
              - type: item_display
                item: mahjongpaper:back
                display_transform: none
                billboard: fixed
                position: 0,0,0
                translation: 0,-16,0
                shadow_radius: 0
                shadow_strength: 0
            hitboxes:
              - type: interaction
                position: 0,0,0
                width: 0.1
                height: 0.18
                blocks_building: false
                interactive: true
                invisible: true

  mahjongpaper:action_button_hitbox:
    material: paper
    settings:
      tags:
        - mahjongpaper:action_button_hitbox
    data:
      item_name: "<!i><gray>Mahjong Action Button</gray>"
    item_model: mahjongcraft:mahjong_tile/back
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      furniture:
        behaviors:
          - type: mahjongpaper:managed_scene
        settings:
          item: mahjongpaper:action_button_hitbox
        variants:
          ground:
            entity_culling:
              aabb_expansion: 0.25
              view_distance: 48
              ray_tracing: true
            elements:
              - type: item_display
                item: mahjongpaper:back
                display_transform: none
                billboard: fixed
                position: 0,0,0
                translation: 0,-16,0
                shadow_radius: 0
                shadow_strength: 0
            hitboxes:
              - type: interaction
                position: 0,0,0
                width: 0.7
                height: 0.22
                blocks_building: false
                interactive: true
                invisible: true

  mahjongpaper:seat_chair_model:
    material: paper
    settings:
      tags:
        - mahjongpaper:seat_visual
    data:
      item_name: "<!i><gray>Mahjong Seat Chair</gray>"
    item_model: mahjongcraft:seat_chair

  mahjongpaper:seat_chair:
    material: paper
    settings:
      tags:
        - mahjongpaper:seat_visual
    data:
      item_name: "<!i><gray>Mahjong Seat Chair Furniture</gray>"
    item_model: mahjongcraft:seat_chair
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      furniture:
        behaviors:
          - type: mahjongpaper:managed_scene
        settings:
          item: mahjongpaper:seat_chair
        variants:
          ground:
            entity_culling:
              aabb_expansion: 0.25
              view_distance: 48
              ray_tracing: true
            elements:
              - type: item_display
                item: mahjongpaper:seat_chair_model
                display_transform: none
                billboard: fixed
                position: 0,0,0
                translation: 0,0,0
                shadow_radius: 0
                shadow_strength: 0
            hitboxes:
              - type: shulker
                position: 0,-1.5,0
                blocks_building: false
                interactive: true
                invisible: true
                seats:
                  - 0,-1.5,0

  # The resource pack advances the rolling texture once per client tick, matching the 1.5 dice
  # cadence. Java selects this item only at roll start and an authoritative static face at reveal.
  mahjongpaper:dice_rolling_model:
    material: paper
    settings:
      tags:
        - mahjongpaper:opening_dice_model
    data:
      item_name: "<!i><white>Rolling Dice</white>"
    item_model: mahjongcraft:dice/rolling

