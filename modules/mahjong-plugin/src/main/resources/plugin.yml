name: MahjongPaper
main: top.ellan.mahjong.plugin.MahjongPaperPlugin
version: ${version}
api-version: "1.20"
folia-supported: true
author: ellan
description: CraftEngine-first Mahjong core with signed external rule packs.
depend:
  - CraftEngine
commands:
  mahjong:
    description: MahjongPaper 2.0 administration and match commands.
    usage: /mahjong <create|join|leave|spectate|ready|bot|start|mode|auto|list|state|remove|rules>
    permission: mahjongpaper.command
permissions:
  mahjongpaper.command:
    default: true
  mahjongpaper.admin:
    default: op
