database:
  # Blank uses an H2 file inside plugins/MahjongPaper/data.
  jdbc-url: ""
  username: "sa"
  password: ""
  maximum-pool-size: 8
rules:
  # HTTPS URL of the Ed25519-signed official registry envelope.
  registry-url: ""
craftengine:
  bundle-folder: "mahjongpaper"
  assets:
    table: "mahjongpaper:table_visual"
    standing-back: "mahjongpaper:tile_standing_face_down_back"
    flat-back: "mahjongpaper:tile_flat_face_down_back"
    hand-hitbox: "mahjongpaper:hand_tile_hitbox"
    action-hitbox: "mahjongpaper:action_button_hitbox"
    # Four fixed slot assets expose CE-owned single_face_1..6 and double_face_1..6 variants.
    opening-die-slot-prefix: "mahjongpaper:opening_die_slot_"
presentation:
  overhead:
    enabled: true
    height: 4.5
    transition-ticks: 16
  opening:
    # Java schedules bounded phase changes; CE owns every visual asset and culling rule.
    preview-frames: 3
    roll-ticks: 20
    reveal-ticks: 12
  sound:
    # Transient sounds stay in the Paper adapter; source files and aliases live in the resource pack.
    opening:
      dice: { key: "mahjongcraft:opening_dice", volume: 0.7, pitch: 1.0 }
      wall-open: { key: "mahjongcraft:opening_wall_break", volume: 0.8, pitch: 1.0 }
    cues:
      tile-shuffle: { key: "mahjongcraft:tile_shuffle", volume: 0.9, pitch: 1.2 }
      tile-draw: { key: "mahjongcraft:tile_draw", volume: 0.65, pitch: 1.05 }
      tile-discard: { key: "mahjongcraft:tile_discard", volume: 0.75, pitch: 1.05 }
      reaction-chi: { key: "mahjongcraft:reaction_chi", volume: 0.8, pitch: 1.1 }
      reaction-pon: { key: "mahjongcraft:reaction_pon", volume: 0.8, pitch: 1.1 }
      reaction-kan: { key: "mahjongcraft:reaction_kan", volume: 0.8, pitch: 1.1 }
      riichi: { key: "minecraft:block.note_block.bell", volume: 0.8, pitch: 1.25 }
      round-win: { key: "mahjongcraft:round_win", volume: 0.9, pitch: 1.0 }
      round-draw: { key: "mahjongcraft:round_draw", volume: 0.9, pitch: 1.0 }
      turn-change: { key: "mahjongcraft:turn_change", volume: 0.5, pitch: 1.6 }
  # Dynamic placement dimensions shared by all rule packs. Static furniture and hitboxes stay in CE YAML.
  geometry:
    tile-width: 0.1125
    tile-height: 0.15
    tile-depth: 0.075
    tile-gap: 0.0025
    surface-height: 0.52
    hand-radius: 1.225
    wall-radius: 1.0
    table-half-length: 1.4375
    emphasis-raise: 0.06
    action-column-spacing: 0.55
    action-row-spacing: 0.24
    secondary-action-offset: 0.34
  capacity:
    hand-tiles: 18
    discards: 48
    meld-tiles: 24
    point-sticks: 64
    auxiliary-tiles: 32
    actions: 64
