name: Publish signed rule registry

on:
  push:
    tags:
      - "rule-registry-v*"
  workflow_dispatch:
    inputs:
      registry_tag:
        description: New immutable tag, for example rule-registry-v2026.08.09.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RULE_PACK_PRIVATE_KEY: ${{ secrets.MAHJONG_RULE_PACK_ED25519_PRIVATE_KEY_PKCS8_BASE64 }}
      RULE_PACK_PUBLIC_KEY: ${{ vars.MAHJONG_RULE_PACK_PUBLIC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Require a new tag and configured signing keys
        shell: bash
        env:
          REGISTRY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.registry_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REGISTRY_TAG" =~ ^rule-registry-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]
          test -n "$RULE_PACK_PRIVATE_KEY"
          test -n "$RULE_PACK_PUBLIC_KEY"
          if gh release view "$REGISTRY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Registry release already exists: $REGISTRY_TAG" >&2
            exit 1
          fi
      - name: Collect every stable official rule-pack release entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registry-entries
          for pair in \
            'riichi:riichi-mahjong-java' \
            'mcr:mahjong-mcr-java' \
            'sichuan:sichuan-mahjong-java'
          do
            rule_id="${pair%%:*}"
            repository="${pair#*:}"
            mapfile -t tags < <(
              gh release list \
                --repo "EllanServer/$repository" \
                --limit 100 \
                --json tagName,isDraft,isPrerelease \
                --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName'
            )
            test "${#tags[@]}" -gt 0
            for tag in "${tags[@]}"; do
              target="registry-entries/$rule_id-${tag#v}.json"
              temporary="$(mktemp -d)"
              gh release download "$tag" \
                --repo "EllanServer/$repository" \
                --pattern registry-entry.json \
                --dir "$temporary"
              mv "$temporary/registry-entry.json" "$target"
              rmdir "$temporary"
            done
          done
      - name: Verify entries and both downloadable artifact types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import hashlib
          import io
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          import zipfile

          expected_repositories = {
              "riichi": "riichi-mahjong-java",
              "mcr": "mahjong-mcr-java",
              "sichuan": "sichuan-mahjong-java",
          }
          code_keys = {
              "id", "version", "url", "sha256", "spiVersion",
              "requiredCoreVersion", "sizeBytes",
          }
          resource_keys = code_keys | {
              "resourceUrl", "resourceSha256", "resourceSizeBytes",
          }

          def verify_download(url, expected_size, expected_sha256):
              request = urllib.request.Request(url, headers={"User-Agent": "MahjongEngine-registry-builder"})
              digest = hashlib.sha256()
              total = 0
              content = bytearray()
              with urllib.request.urlopen(request, timeout=120) as response:
                  while chunk := response.read(65536):
                      total += len(chunk)
                      if total > 64 * 1024 * 1024:
                          raise SystemExit(f"artifact too large: {url}")
                      digest.update(chunk)
                      content.extend(chunk)
              if total != expected_size or digest.hexdigest() != expected_sha256:
                  raise SystemExit(f"artifact bytes differ: {url}")
              return bytes(content)

          def properties(data, label):
              result = {}
              for raw in data.decode("utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith(("#", "!")):
                      continue
                  separator = line.find("=")
                  if separator < 1:
                      raise SystemExit(f"malformed {label}")
                  key, value = line[:separator].strip(), line[separator + 1:].strip()
                  if not key or key in result:
                      raise SystemExit(f"duplicate {label} key: {key}")
                  result[key] = value
              return result

          def verify_resource_archive(content, rule_id, version):
              required = {
                  "META-INF/mahjong-rule-resources.properties",
                  "META-INF/mahjong-rule-sounds.properties",
                  "META-INF/RESOURCEPACK_ATTRIBUTION.md",
                  "craftengine/_bundle_index.txt",
                  "craftengine/_bundle_manifest.sha256",
                  "craftengine/pack.yml",
              }
              with zipfile.ZipFile(io.BytesIO(content)) as archive:
                  files = {}
                  total_uncompressed = 0
                  if len(archive.infolist()) > 20_000:
                      raise SystemExit("rule resource ZIP has too many entries")
                  for item in archive.infolist():
                      name = item.filename
                      parts = pathlib.PurePosixPath(name.rstrip("/")).parts
                      if ("\\" in name or name.startswith("/") or ".." in parts
                              or not parts or item.file_size < 0
                              or item.file_size > 64 * 1024 * 1024):
                          raise SystemExit(f"unsafe rule resource path: {name}")
                      if item.is_dir():
                          continue
                      total_uncompressed += item.file_size
                      if total_uncompressed > 256 * 1024 * 1024:
                          raise SystemExit("rule resource ZIP exceeds expansion limit")
                      lower = name.lower()
                      allowed_meta = (name in required
                                      or name.startswith("META-INF/licenses/"))
                      if (lower.endswith((".class", ".jar", ".java"))
                              or name.startswith("META-INF/services/")
                              or (not name.startswith("craftengine/") and not allowed_meta)):
                          raise SystemExit(f"non-CE rule resource payload: {name}")
                      if name in files:
                          raise SystemExit(f"duplicate rule resource path: {name}")
                      files[name] = archive.read(item)
                  if not required.issubset(files):
                      raise SystemExit("rule resource ZIP is missing required CE metadata")

                  descriptor = properties(
                      files["META-INF/mahjong-rule-resources.properties"],
                      "rule resource descriptor",
                  )
                  if descriptor != {"format": "1", "id": rule_id, "version": version}:
                      raise SystemExit("rule resource descriptor differs from release coordinate")

                  namespace = "mahjong_" + rule_id + "_v" + re.sub(
                      r"[^0-9A-Za-z]", "_", version,
                  ).lower()
                  sounds = properties(
                      files["META-INF/mahjong-rule-sounds.properties"],
                      "rule sound descriptor",
                  )
                  if (not sounds or any(
                          not value.split(",", 1)[0].strip().startswith(namespace + ":")
                          for value in sounds.values())):
                      raise SystemExit("rule sounds must use a version-isolated CE namespace")
                  registry_path = (
                      f"craftengine/resourcepack/assets/{namespace}/sounds.json"
                  )
                  if registry_path not in files:
                      raise SystemExit("versioned CraftEngine sounds.json is missing")
                  namespace_lines = [
                      line.strip()
                      for line in files["craftengine/pack.yml"]
                          .decode("utf-8").splitlines()
                      if line.strip().startswith("namespace:")
                  ]
                  if namespace_lines != [f"namespace: {namespace}"]:
                      raise SystemExit("CraftEngine pack namespace differs from rule version")
                  registry = json.loads(files[registry_path])
                  for value in sounds.values():
                      event = value.split(",", 1)[0].split(":", 1)[1]
                      if event not in registry:
                          raise SystemExit(f"sounds.json has no event: {event}")

                  index = {
                      line.strip()
                      for line in files["craftengine/_bundle_index.txt"]
                          .decode("utf-8").splitlines()
                      if line.strip()
                  }
                  actual = {
                      name.removeprefix("craftengine/")
                      for name in files
                      if name.startswith("craftengine/")
                      and name != "craftengine/_bundle_index.txt"
                  }
                  if index != actual or "_bundle_manifest.sha256" not in index:
                      raise SystemExit("CraftEngine bundle index differs from ZIP contents")
                  manifest = {}
                  for line in (
                      files["craftengine/_bundle_manifest.sha256"]
                          .decode("utf-8").splitlines()
                  ):
                      digest, separator, name = line.partition("  ")
                      if (separator != "  " or not re.fullmatch(r"[0-9a-f]{64}", digest)
                              or not name or name in manifest):
                          raise SystemExit("invalid CraftEngine bundle manifest")
                      manifest[name] = digest
                  content_names = index - {"_bundle_manifest.sha256"}
                  if set(manifest) != content_names:
                      raise SystemExit("CraftEngine index and manifest differ")
                  for name, digest in manifest.items():
                      if hashlib.sha256(files["craftengine/" + name]).hexdigest() != digest:
                          raise SystemExit(f"CraftEngine content hash mismatch: {name}")

          entries = []
          coordinates = set()
          seen_ids = set()
          for path in sorted(pathlib.Path("registry-entries").glob("*.json")):
              entry = json.loads(path.read_text(encoding="utf-8"))
              if set(entry) not in (code_keys, resource_keys):
                  raise SystemExit(f"unexpected fields in {path}: {set(entry)}")
              rule_id = entry["id"]
              if rule_id not in expected_repositories:
                  raise SystemExit(f"unofficial rule id in {path}: {rule_id}")
              version = entry["version"]
              if not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z._+-]{0,63}", version):
                  raise SystemExit(f"invalid version in {path}")
              semantic = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:[-+].*)?", version)
              if semantic and tuple(map(int, semantic.groups())) >= (2, 0, 2) and set(entry) != resource_keys:
                  raise SystemExit(f"rule versions 2.0.2+ require a resource artifact: {path}")
              coordinate = (rule_id, version)
              if coordinate in coordinates:
                  raise SystemExit(f"duplicate coordinate: {coordinate}")
              coordinates.add(coordinate)
              seen_ids.add(rule_id)
              if entry["spiVersion"] not in {"1.4.0", "1.5.0", "1.6.0"}:
                  raise SystemExit(f"unsupported SPI version in {path}")
              if not isinstance(entry["sizeBytes"], int) or not 1 <= entry["sizeBytes"] <= 64 * 1024 * 1024:
                  raise SystemExit(f"invalid size in {path}")
              if not re.fullmatch(r"[0-9a-f]{64}", entry["sha256"]):
                  raise SystemExit(f"invalid SHA-256 in {path}")
              parsed = urllib.parse.urlparse(entry["url"])
              expected_prefix = f"/EllanServer/{expected_repositories[rule_id]}/releases/download/v{version}/"
              if parsed.scheme != "https" or parsed.netloc != "github.com" or not parsed.path.startswith(expected_prefix):
                  raise SystemExit(f"unexpected artifact URL in {path}: {entry['url']}")
              verify_download(entry["url"], entry["sizeBytes"], entry["sha256"])
              if set(entry) == resource_keys:
                  if not isinstance(entry["resourceSizeBytes"], int) or not 1 <= entry["resourceSizeBytes"] <= 64 * 1024 * 1024:
                      raise SystemExit(f"invalid resource size in {path}")
                  if not re.fullmatch(r"[0-9a-f]{64}", entry["resourceSha256"]):
                      raise SystemExit(f"invalid resource SHA-256 in {path}")
                  resource_parsed = urllib.parse.urlparse(entry["resourceUrl"])
                  if resource_parsed.scheme != "https" or resource_parsed.netloc != "github.com" or not resource_parsed.path.startswith(expected_prefix):
                      raise SystemExit(f"unexpected resource URL in {path}: {entry['resourceUrl']}")
                  resource_content = verify_download(
                      entry["resourceUrl"],
                      entry["resourceSizeBytes"],
                      entry["resourceSha256"],
                  )
                  verify_resource_archive(resource_content, rule_id, version)
              entries.append(entry)

          if seen_ids != set(expected_repositories):
              raise SystemExit(f"registry must include all official ids; got {seen_ids}")
          generated = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          payload = {"format": 2, "generatedAt": generated, "packs": sorted(entries, key=lambda item: (item["id"], item["version"]))}
          pathlib.Path("registry-payload.json").write_text(
              json.dumps(payload, ensure_ascii=True, separators=(",", ":")),
              encoding="utf-8",
              newline="\n",
          )
          PY
      - name: Sign the raw registry payload with Ed25519
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RULE_PACK_PRIVATE_KEY" | base64 --decode > signing-key.der
          openssl pkey -inform DER -in signing-key.der -out signing-key.pem
          DERIVED_PUBLIC="$(openssl pkey -in signing-key.pem -pubout -outform DER | base64 -w0)"
          test "$DERIVED_PUBLIC" = "$RULE_PACK_PUBLIC_KEY"
          openssl pkeyutl -sign -rawin \
            -inkey signing-key.pem \
            -in registry-payload.json \
            -out registry-signature.bin
          printf '%s' "$RULE_PACK_PUBLIC_KEY" | base64 --decode > verification-key.der
          openssl pkey -pubin -inform DER -in verification-key.der -out verification-key.pem
          openssl pkeyutl -verify -rawin -pubin \
            -inkey verification-key.pem \
            -in registry-payload.json \
            -sigfile registry-signature.bin
          PAYLOAD_B64="$(base64 -w0 registry-payload.json)"
          SIGNATURE_B64="$(base64 -w0 registry-signature.bin)"
          export PAYLOAD_B64 SIGNATURE_B64
          python3 - <<'PY'
          import json, os, pathlib
          envelope = {
              "format": 1,
              "payload": os.environ["PAYLOAD_B64"],
              "signature": os.environ["SIGNATURE_B64"],
          }
          pathlib.Path("registry.json").write_text(
              json.dumps(envelope, ensure_ascii=True, separators=(",", ":")) + "\n",
              encoding="ascii",
              newline="\n",
          )
          PY
          rm -f signing-key.der signing-key.pem verification-key.der verification-key.pem registry-signature.bin
      - name: Publish immutable signed registry release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.registry_tag || github.ref_name }}
          generate_release_notes: false
          body: |
            Signed official MahjongPaper rule-pack registry.
            Configure `rules.registry-url` with this release's `registry.json` asset URL.
          files: |
            registry.json
            registry-payload.json
