name: Performance infrastructure

on:
  pull_request:
    paths:
      - ".github/workflows/performance-*.yml"
      - "build.gradle.kts"
      - "buildSrc/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "src/perfTest/**"
      - "perf/ab/**"
      - "perf/live/**"
      - "docs/performance-testing.md"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/performance-*.yml"
      - "build.gradle.kts"
      - "buildSrc/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "src/perfTest/**"
      - "perf/ab/**"
      - "perf/live/**"
      - "docs/performance-testing.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.2+10.0.LTS"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Validate statistics and order balancing
        run: python3 -m unittest discover -s perf/ab/tests -v

      - name: Probe unprivileged candidate evidence isolation
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd \
            --system \
            --user-group \
            --no-create-home \
            --shell /usr/sbin/nologin \
            mahjong-probe

          PROBE_ROOT="/tmp/mahjong-performance-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d --owner root --group root --mode 0711 "$PROBE_ROOT"
          sudo install -d \
            --owner "$(id -u)" \
            --group "$(id -g)" \
            --mode 0711 \
            "$PROBE_ROOT/evidence"
          sudo install -d \
            --owner "$(id -u)" \
            --group "$(id -g)" \
            --mode 0711 \
            "$PROBE_ROOT/runtime-tmp"
          python3 perf/ab/tests/isolation_probe.py \
            --user mahjong-probe \
            --output-dir "$PROBE_ROOT/evidence"
          mkdir -p build/reports/jmh/isolation-probe
          cp -a "$PROBE_ROOT/evidence/." build/reports/jmh/isolation-probe/

      - name: Build isolated JMH harness
        run: >-
          ./gradlew jmhJar --console plain --no-daemon
          -x configureGbMahjongNative -x buildGbMahjongNative -x packageGbMahjongNative
          "-PmahjongPaperDevBundle=1.20.1-R0.1-SNAPSHOT"
          "-PmahjongJavaToolchain=25" "-PmahjongJavaTarget=17"

      - name: Regress isolated JMH lock ownership
        shell: bash
        run: |
          set -euo pipefail
          PROBE_ROOT="/tmp/mahjong-performance-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SOURCE_JAR="$(find build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)"
          test -n "$SOURCE_JAR"
          mkdir -p "$PROBE_ROOT/evidence/jars"
          cp "$SOURCE_JAR" "$PROBE_ROOT/evidence/jars/infra-jmh.jar"
          chmod 0444 "$PROBE_ROOT/evidence/jars/infra-jmh.jar"
          JAR="$PROBE_ROOT/evidence/jars/infra-jmh.jar"
          sudo -H -u mahjong-probe -- test -r "$JAR"
          sudo -H -u mahjong-probe -- test ! -w "$JAR"
          python3 perf/ab/run_matrix.py \
            --phase ab \
            --profile infra \
            --base-jar "$JAR" \
            --candidate-jar "$JAR" \
            --base-sha "$GITHUB_SHA" \
            --candidate-sha "$GITHUB_SHA" \
            --config perf/ab/gate-config.json \
            --output-dir "$PROBE_ROOT/evidence/lock-regression" \
            --runtime-temp-root "$PROBE_ROOT/runtime-tmp" \
            --java "$JAVA_HOME/bin/java" \
            --candidate-command-prefix-json '["sudo","-H","-u","mahjong-probe","--"]' \
            --candidate-file-user mahjong-probe \
            --forks 1 \
            --warmup-iterations 1 \
            --measurement-iterations 1 \
            --warmup-time 10ms \
            --measurement-time 10ms

      - name: Stage isolated JMH lock evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PROBE_ROOT="/tmp/mahjong-performance-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "$PROBE_ROOT/evidence/lock-regression" ]]; then
            mkdir -p build/reports/jmh/lock-regression
            cp -a "$PROBE_ROOT/evidence/lock-regression/." build/reports/jmh/lock-regression/
          fi

      - name: Run one smoke iteration for every protected benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/jmh
          JAR="$(find build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)"
          java -Xms256m -Xmx256m -jar "$JAR" \
            '^top\.ellan\.mahjong\..*Benchmark\..*$' \
            -bm avgt -tu ns -f 1 -wi 1 -i 1 -w 10ms -r 10ms \
            -prof gc -foe true -rf json -rff build/reports/jmh/infra-smoke.json

      - name: Validate live-server harness
        run: python3 -m unittest discover -s perf/live/tests -v

      - name: Set up pinned external protocol client runtime
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Install locked protocol client and run frame tests
        working-directory: perf/live/client
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Set up pinned Paper runtime JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"

      - name: Download checksum-locked Paper server.jar
        run: >-
          python3 perf/live/download_locked.py
          --artifact paper-1.20.1-196
          --destination build/live-cache/server.jar

      - name: Run isolated standard server.jar infrastructure smoke
        shell: bash
        run: >-
          python3 perf/live/run_server.py
          --paper-jar build/live-cache/server.jar
          --output-dir build/reports/live-paper-smoke
          --warmup-seconds 5
          --measurement-seconds 20
          --sample-interval-seconds 5
          --startup-timeout-seconds 360
          --shutdown-timeout-seconds 60

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-infrastructure-smoke
          path: |
            build/reports/jmh/**
            build/reports/live-paper-smoke/**
          if-no-files-found: error
          retention-days: 14
