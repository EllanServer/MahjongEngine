name: Build 2.0

on:
  push:
    branches:
      - "2.0"
  pull_request:
    branches:
      - main
      - "2.0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-2.0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  verify:
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Compile and test every module
        run: ./gradlew clean check :mahjong-plugin:shadowJar --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-test-reports-linux
          path: modules/*/build/reports/tests/**
          if-no-files-found: ignore

  artifact-contract:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Build the platform-independent core plugin
        run: ./gradlew :mahjong-plugin:shadowJar --no-daemon --stacktrace
      - name: Verify Java 25 and legacy-free artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find modules/mahjong-plugin/build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          mkdir inspect
          (cd inspect && jar xf "$GITHUB_WORKSPACE/$JAR" plugin.yml paper-plugin.yml)
          grep -q 'api-version: "1.20"' inspect/plugin.yml
          grep -q 'CraftEngine' inspect/plugin.yml
          python3 - "$JAR" <<'PY'
          import struct, sys, zipfile

          jar = sys.argv[1]
          forbidden = (
              "native/",
              "top/ellan/mahjong/table/core/",
              "top/ellan/mahjong/gb/jni/",
              "io/github/ssttkkl/mahjongutils/",
              "kotlin/",
          )
          bad_classes = []
          bad_entries = []
          with zipfile.ZipFile(jar) as archive:
              for name in archive.namelist():
                  if name.startswith(forbidden):
                      bad_entries.append(name)
                  if not name.endswith(".class"):
                      continue
                  header = archive.read(name)[:8]
                  if len(header) == 8 and header[:4] == b"\xca\xfe\xba\xbe":
                      major = struct.unpack(">H", header[6:8])[0]
                      if major > 69:
                          bad_classes.append((name, major))
          if bad_entries:
              raise SystemExit(f"legacy/forbidden artifact entries: {bad_entries[:20]}")
          if bad_classes:
              raise SystemExit(f"classes newer than Java 25: {bad_classes[:20]}")
          print("Artifact is Java 25 and contains no legacy rule/native path")
          PY
      - name: Upload core plugin
        uses: actions/upload-artifact@v7
        with:
          name: MahjongPaper-2.0
          path: modules/mahjong-plugin/build/libs/*.jar
          if-no-files-found: error
