name: Build 2.0

on:
  push:
    branches:
      - "2.0"
  pull_request:
    branches:
      - main
      - "2.0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-2.0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  verify:
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Compile and test every module
        shell: bash
        run: |
          bash .github/scripts/gradle-with-transient-retry.sh gradle-verify.log -- \
            ./gradlew clean check :mahjong-plugin:shadowJar --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-test-reports-linux
          path: |
            modules/*/build/reports/tests/**
            gradle-verify.log
          if-no-files-found: ignore

  official-rule-packs:
    needs: wrapper-validation
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        repository:
          - mahjong-mcr-java
          - riichi-mahjong-java
          - sichuan-mahjong-java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MahjongEngine
        uses: actions/checkout@v7
      - name: Checkout ${{ matrix.repository }} 2.0
        uses: actions/checkout@v7
        with:
          repository: EllanServer/${{ matrix.repository }}
          ref: "2.0"
          path: official-rule
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish the current Rule SDK for the candidate
        shell: bash
        run: |
          chmod +x ./gradlew
          bash .github/scripts/gradle-with-transient-retry.sh \
            "gradle-rule-sdk-${{ matrix.repository }}.log" -- \
              ./gradlew \
                :mahjong-rule-spi:publishAllPublicationsToTestRepository \
                :mahjong-rule-tck:publishAllPublicationsToTestRepository \
                --no-daemon --stacktrace
      - name: Compile and test the official rule pack
        working-directory: official-rule
        shell: bash
        run: |
          chmod +x ./gradlew
          bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-transient-retry.sh" \
            "$GITHUB_WORKSPACE/gradle-official-${{ matrix.repository }}.log" -- \
              ./gradlew clean check jar \
                -PmahjongRuleSdkRepo="$GITHUB_WORKSPACE/build/rule-sdk-repository" \
                --no-daemon --stacktrace
      - name: Verify the runtime sandbox can load the official artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find official-rule/build/libs -maxdepth 1 \
            -name '*rule-pack-*.jar' \
            ! -name '*-thin.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -print -quit)"
          test -n "$JAR"
          RULE_PACK_ARTIFACT="$GITHUB_WORKSPACE/$JAR" \
            bash .github/scripts/gradle-with-transient-retry.sh \
              "gradle-runtime-${{ matrix.repository }}.log" -- \
                ./gradlew :mahjong-rule-runtime:test \
                  --tests '*OfficialRulePackCompatibilityTest' \
                  --no-daemon --stacktrace
      - name: Upload official rule-pack logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-rule-${{ matrix.repository }}-logs
          path: gradle-*-${{ matrix.repository }}.log
          if-no-files-found: ignore

  # Measures the scene projection twice on ONE runner: this pull request, then the base commit
  # it merges into. Pairing both measurements on the same machine is what makes this a gate
  # instead of noise, because the harness is not JMH and the ubuntu-latest pool drifts between
  # runner sizes, so a stored baseline would compare unrelated hardware.
  scene-projection-regression:
    if: github.event_name == 'pull_request'
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Measure the candidate
        shell: bash
        run: |
          bash .github/scripts/gradle-with-transient-retry.sh perf-candidate.log -- \
            ./gradlew :mahjong-presentation:sceneProjectionBenchmark --no-daemon --stacktrace
      - name: Checkout the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Measure the base commit on the same runner
        working-directory: base
        shell: bash
        run: |
          chmod +x ./gradlew
          bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-transient-retry.sh" \
            "$GITHUB_WORKSPACE/perf-base.log" -- \
              ./gradlew :mahjong-presentation:sceneProjectionBenchmark --no-daemon --stacktrace
      - name: Gate on the comparison
        shell: bash
        run: python3 .github/scripts/compare-scene-benchmark.py perf-candidate.log perf-base.log
      - name: Upload both measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scene-projection-ab
          path: perf-*.log
          if-no-files-found: ignore

  # H2 cannot prove what another optimizer chooses. These disposable services run the same
  # migration and EXPLAIN assertions against both external dialects the plugin advertises.
  external-sql-plans:
    needs: wrapper-validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mahjong
          MYSQL_USER: mahjong
          MYSQL_PASSWORD: mahjong
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mahjong
          MARIADB_USER: mahjong
          MARIADB_PASSWORD: mahjong
        ports:
          - 13307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MAHJONG_MYSQL_TEST_URL: "jdbc:mysql://127.0.0.1:13306/mahjong?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true"
      MAHJONG_MARIADB_TEST_URL: "jdbc:mariadb://127.0.0.1:13307/mahjong?useBulkStmts=true"
      MAHJONG_SQL_TEST_USER: mahjong
      MAHJONG_SQL_TEST_PASSWORD: mahjong
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Verify real MySQL and MariaDB leaderboard plans
        shell: bash
        run: |
          bash .github/scripts/gradle-with-transient-retry.sh external-sql-plans.log -- \
            ./gradlew :mahjong-persistence-sql:test \
              --tests '*ExternalRankingQueryPlanTest*' \
              --no-daemon --stacktrace
      - name: Upload external SQL plan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-sql-plan-reports
          path: |
            modules/mahjong-persistence-sql/build/reports/tests/test/**
            external-sql-plans.log
          if-no-files-found: ignore

  artifact-contract:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Build the platform-independent core plugin
        shell: bash
        run: |
          bash .github/scripts/gradle-with-transient-retry.sh gradle-artifact.log -- \
            ./gradlew :mahjong-plugin:jar :mahjong-plugin:verifyThinJar --no-daemon --stacktrace
      - name: Verify Java 25 and legacy-free artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find modules/mahjong-plugin/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          mkdir inspect
          (cd inspect && jar xf "$GITHUB_WORKSPACE/$JAR" paper-plugin.yml META-INF/mahjong-runtime-libraries.txt)
          grep -q 'api-version: "1.20"' inspect/paper-plugin.yml
          grep -q 'loader: top.ellan.mahjong.plugin.loader.MahjongPaperLoader' inspect/paper-plugin.yml
          grep -q 'CraftEngine' inspect/paper-plugin.yml
          grep -q 'net.momirealms:sparrow-yaml:1.0.12' inspect/META-INF/mahjong-runtime-libraries.txt
          python3 - "$JAR" <<'PY'
          import struct, sys, zipfile

          jar = sys.argv[1]
          forbidden = (
              "native/",
              "top/ellan/mahjong/table/core/",
              "top/ellan/mahjong/gb/jni/",
              "io/github/ssttkkl/mahjongutils/",
              "kotlin/",
          )
          bad_classes = []
          bad_entries = []
          foreign_classes = []
          nested_jars = []
          with zipfile.ZipFile(jar) as archive:
              for name in archive.namelist():
                  if name.startswith(forbidden):
                      bad_entries.append(name)
                  if name.endswith(".jar"):
                      nested_jars.append(name)
                  if not name.endswith(".class"):
                      continue
                  if not name.startswith("top/ellan/mahjong/"):
                      foreign_classes.append(name)
                  header = archive.read(name)[:8]
                  if len(header) == 8 and header[:4] == b"\xca\xfe\xba\xbe":
                      major = struct.unpack(">H", header[6:8])[0]
                      if major > 69:
                          bad_classes.append((name, major))
          if bad_entries:
              raise SystemExit(f"legacy/forbidden artifact entries: {bad_entries[:20]}")
          if foreign_classes:
              raise SystemExit(f"thin JAR contains third-party classes: {foreign_classes[:20]}")
          if nested_jars:
              raise SystemExit(f"thin JAR contains nested JARs: {nested_jars[:20]}")
          if bad_classes:
              raise SystemExit(f"classes newer than Java 25: {bad_classes[:20]}")
          print("Artifact is a Java 25 thin JAR with no legacy/native path")
          PY
      - name: Upload core plugin
        uses: actions/upload-artifact@v7
        with:
          name: MahjongPaper-2.0
          path: |
            modules/mahjong-plugin/build/libs/*.jar
            !modules/mahjong-plugin/build/libs/*-sources.jar
          if-no-files-found: error
