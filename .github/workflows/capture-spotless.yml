name: Capture Spotless output

on:
  push:
    branches:
      - codex/perf-ab-infra

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Capture canonical Kotlin formatting
        run: >-
          ./gradlew spotlessKotlinApply
          '-PspotlessFiles=.*CorePerformanceBenchmarksTest[.]kt'

      - name: Upload formatted benchmark fixture
        uses: actions/upload-artifact@v7
        with:
          name: spotless-core-performance-benchmarks
          path: src/test/kotlin/top/ellan/mahjong/perf/CorePerformanceBenchmarksTest.kt
          if-no-files-found: error
