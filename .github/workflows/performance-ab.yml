name: Performance A/B gate

# This definition is always loaded from the base branch. Candidate Gradle/JMH code runs only
# after its complete build surface has been byte-compared with the base revision. It receives
# no secrets, no writable repository permission and no Actions/Gradle cache credentials. The
# final decision runs on a fresh runner from a newly checked-out base-owned gate.
on:
  pull_request_target:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit to benchmark
        required: true
        type: string
      candidate_sha:
        description: Exact candidate commit to benchmark
        required: true
        type: string
      profile:
        description: Base-owned benchmark profile
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - gb-bot
          - region-fingerprint
          - display-spawn
          - region-queue
          - region-keys
          - layout
          - scheduler-reflection
          - ray-proxy
          - riichi-reaction
          - sichuan-hu
          - region-apply
          - layout-cache
          - infra
      forks:
        description: Trusted CI override for JMH forks (blank uses base config)
        required: false
        type: string
      warmup_iterations:
        description: Trusted CI override for JMH warmup iterations
        required: false
        type: string
      measurement_iterations:
        description: Trusted CI override for JMH measurement iterations
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: performance-ab-${{ github.event.pull_request.number || inputs.candidate_sha }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'performance-ab')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      profile: ${{ steps.profile.outputs.name }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      PREPARED_ROOT: /tmp/mahjong-performance-prepared-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Require a same-repository optimization branch
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo "::error::The trusted performance gate cannot execute candidate code from a fork"
            exit 1
          fi

      - name: Check out base-owned harness
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable revision identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.2+10.0.LTS"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Gradle without shared cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Make wrappers executable
        shell: bash
        run: chmod +x base/gradlew candidate/gradlew

      - name: Resolve one benchmark profile
        id: profile
        shell: bash
        env:
          DISPATCH_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            PROFILE="$DISPATCH_PROFILE"
          else
            PROFILE="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          labels = {entry["name"] for entry in payload["pull_request"]["labels"]}
          choices = {
              "performance-snapshot": "snapshot",
              "performance-gb-bot": "gb-bot",
              "performance-region-fingerprint": "region-fingerprint",
              "performance-display-spawn": "display-spawn",
              "performance-region-queue": "region-queue",
              "performance-region-keys": "region-keys",
              "performance-layout": "layout",
              "performance-scheduler-reflection": "scheduler-reflection",
              "performance-ray-proxy": "ray-proxy",
              "performance-riichi-reaction": "riichi-reaction",
              "performance-sichuan-hu": "sichuan-hu",
              "performance-region-apply": "region-apply",
              "performance-layout-cache": "layout-cache",
          }
          selected = [profile for label, profile in choices.items() if label in labels]
          if len(selected) != 1:
              raise SystemExit("performance-ab requires exactly one performance-* profile label")
          print(selected[0])
          PY
          )"
          fi
          echo "name=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Verify candidate cannot alter benchmark, thresholds or Gradle
        shell: bash
        run: |
          set -euo pipefail
          python3 base/perf/ab/verify_protected.py \
            --base-dir base \
            --candidate-dir candidate \
            --config base/perf/ab/gate-config.json \
            --report "$PREPARED_ROOT/protected-paths-prepare.json"

      - name: Test base-owned statistics
        shell: bash
        run: python3 -m unittest discover -s base/perf/ab/tests -v

      - name: Build base JMH jar
        shell: bash
        env:
          # The cache is local to this disposable runner and never restored/saved. Sharing it
          # makes mutable upstream SNAPSHOT resolution identical for both compilations.
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-build
        run: >-
          base/gradlew -p base jmhJar --console plain --no-daemon
          -x configureGbMahjongNative -x buildGbMahjongNative -x packageGbMahjongNative
          "-PmahjongPaperDevBundle=1.20.1-R0.1-SNAPSHOT"
          "-PmahjongJavaToolchain=25" "-PmahjongJavaTarget=17"

      - name: Build candidate JMH jar without privileged runtime credentials
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-build
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: >-
          candidate/gradlew -p candidate jmhJar --console plain --no-daemon
          -x configureGbMahjongNative -x buildGbMahjongNative -x packageGbMahjongNative
          "-PmahjongPaperDevBundle=1.20.1-R0.1-SNAPSHOT"
          "-PmahjongJavaToolchain=25" "-PmahjongJavaTarget=17"

      - name: Stage immutable benchmark inputs
        shell: bash
        run: |
          set -euo pipefail
          BASE_JAR="$(find base/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)"
          CANDIDATE_JAR="$(find candidate/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)"
          test -n "$BASE_JAR"
          test -n "$CANDIDATE_JAR"
          mkdir -p "$PREPARED_ROOT/jars"
          cp base/perf/ab/gate-config.json "$PREPARED_ROOT/gate-config.json"
          cp "$BASE_JAR" "$PREPARED_ROOT/jars/base-jmh.jar"
          cp "$CANDIDATE_JAR" "$PREPARED_ROOT/jars/candidate-jmh.jar"
          chmod 0444 \
            "$PREPARED_ROOT/gate-config.json" \
            "$PREPARED_ROOT/jars/base-jmh.jar" \
            "$PREPARED_ROOT/jars/candidate-jmh.jar"
          (
            cd "$PREPARED_ROOT"
            sha256sum gate-config.json jars/base-jmh.jar jars/candidate-jmh.jar > SHA256SUMS
          )

      - name: Record prepared input provenance
        shell: bash
        env:
          PROFILE: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          python3 - "$PREPARED_ROOT" "$BASE_SHA" "$CANDIDATE_SHA" "$PROFILE" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          files = {}
          for relative in ("gate-config.json", "jars/base-jmh.jar", "jars/candidate-jmh.jar"):
              path = root / relative
              files[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {
              "schema_version": 1,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "base_sha": sys.argv[2],
              "candidate_sha": sys.argv[3],
              "profile": sys.argv[4],
              "files": files,
          }
          (root / "prepared-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable benchmark inputs
        uses: actions/upload-artifact@v7
        with:
          name: performance-ab-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PREPARED_ROOT }}/**
          if-no-files-found: error
          retention-days: 1

  benchmark:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        pair_index:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      PROFILE: ${{ needs.prepare.outputs.profile }}
      PAIR_INDEX: ${{ matrix.pair_index }}
      PREPARED_ROOT: /tmp/mahjong-performance-prepared-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair_index }}
      PERF_RESULTS_ROOT: /tmp/mahjong-performance-ab-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair_index }}
      CI_FORKS: ${{ inputs.forks }}
      CI_WARMUPS: ${{ inputs.warmup_iterations }}
      CI_MEASUREMENTS: ${{ inputs.measurement_iterations }}

    steps:
      - name: Check out base-owned benchmark runner
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.2+10.0.LTS"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download immutable benchmark inputs
        uses: actions/download-artifact@v8
        with:
          name: performance-ab-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PREPARED_ROOT }}

      - name: Verify prepared inputs
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$PREPARED_ROOT"
            sha256sum --check SHA256SUMS
          )
          cmp base/perf/ab/gate-config.json "$PREPARED_ROOT/gate-config.json"
          python3 - "$PREPARED_ROOT/prepared-manifest.json" \
            "$BASE_SHA" "$CANDIDATE_SHA" "$PROFILE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "base_sha": sys.argv[2],
              "candidate_sha": sys.argv[3],
              "profile": sys.argv[4],
              "github_run_id": sys.argv[5],
              "github_run_attempt": sys.argv[6],
          }
          for key, wanted in expected.items():
              if str(value.get(key)) != wanted:
                  raise SystemExit(f"prepared manifest {key} mismatch")
          PY

      - name: Create isolated runner-local evidence directories
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd \
            --system \
            --user-group \
            --no-create-home \
            --shell /usr/sbin/nologin \
            mahjong-benchmark
          getent passwd mahjong-benchmark
          sudo install -d --owner root --group root --mode 0711 "$PERF_RESULTS_ROOT"
          sudo install -d \
            --owner "$(id -u)" \
            --group "$(id -g)" \
            --mode 0711 \
            "$PERF_RESULTS_ROOT/evidence"
          sudo install -d \
            --owner "$(id -u)" \
            --group "$(id -g)" \
            --mode 0711 \
            "$PERF_RESULTS_ROOT/runtime-tmp"
          RUNNER_SESSION_ID="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "RUNNER_SESSION_ID=$RUNNER_SESSION_ID" >> "$GITHUB_ENV"
          sudo -H -u mahjong-benchmark -- test -r "$PREPARED_ROOT/jars/base-jmh.jar"
          sudo -H -u mahjong-benchmark -- test -r "$PREPARED_ROOT/jars/candidate-jmh.jar"
          sudo -H -u mahjong-benchmark -- test ! -w "$PREPARED_ROOT/jars/base-jmh.jar"
          sudo -H -u mahjong-benchmark -- test ! -w "$PREPARED_ROOT/jars/candidate-jmh.jar"
          sudo -H -u mahjong-benchmark -- test ! -w "$PERF_RESULTS_ROOT/evidence"
          sudo -H -u mahjong-benchmark -- test ! -w "$PERF_RESULTS_ROOT/runtime-tmp"

      - name: Run runner-local A/A control pair
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          OVERRIDES=()
          [[ -z "$CI_FORKS" ]] || OVERRIDES+=(--forks "$CI_FORKS")
          [[ -z "$CI_WARMUPS" ]] || OVERRIDES+=(--warmup-iterations "$CI_WARMUPS")
          [[ -z "$CI_MEASUREMENTS" ]] || OVERRIDES+=(--measurement-iterations "$CI_MEASUREMENTS")
          python3 base/perf/ab/run_matrix.py \
            --phase aa \
            --profile "$PROFILE" \
            --base-jar "$PREPARED_ROOT/jars/base-jmh.jar" \
            --candidate-jar "$PREPARED_ROOT/jars/base-jmh.jar" \
            --base-sha "$BASE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --config base/perf/ab/gate-config.json \
            --output-dir "$PERF_RESULTS_ROOT/evidence/aa" \
            --runtime-temp-root "$PERF_RESULTS_ROOT/runtime-tmp" \
            --java "$JAVA_HOME/bin/java" \
            --pair-start "$PAIR_INDEX" \
            --pair-count 1 \
            --runner-session-id "$RUNNER_SESSION_ID" \
            --candidate-command-prefix-json '["sudo","-H","-u","mahjong-benchmark","--"]' \
            --candidate-file-user mahjong-benchmark \
            "${OVERRIDES[@]}"

      - name: Run runner-local A/B pair
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          OVERRIDES=()
          [[ -z "$CI_FORKS" ]] || OVERRIDES+=(--forks "$CI_FORKS")
          [[ -z "$CI_WARMUPS" ]] || OVERRIDES+=(--warmup-iterations "$CI_WARMUPS")
          [[ -z "$CI_MEASUREMENTS" ]] || OVERRIDES+=(--measurement-iterations "$CI_MEASUREMENTS")
          python3 base/perf/ab/run_matrix.py \
            --phase ab \
            --profile "$PROFILE" \
            --base-jar "$PREPARED_ROOT/jars/base-jmh.jar" \
            --candidate-jar "$PREPARED_ROOT/jars/candidate-jmh.jar" \
            --base-sha "$BASE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --config base/perf/ab/gate-config.json \
            --output-dir "$PERF_RESULTS_ROOT/evidence/ab" \
            --runtime-temp-root "$PERF_RESULTS_ROOT/runtime-tmp" \
            --java "$JAVA_HOME/bin/java" \
            --pair-start "$PAIR_INDEX" \
            --pair-count 1 \
            --runner-session-id "$RUNNER_SESSION_ID" \
            --candidate-command-prefix-json '["sudo","-H","-u","mahjong-benchmark","--"]' \
            --candidate-file-user mahjong-benchmark \
            "${OVERRIDES[@]}"

      - name: Upload runner-local evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-ab-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair_index }}
          path: ${{ env.PERF_RESULTS_ROOT }}/evidence/**
          if-no-files-found: error
          retention-days: 1

  decide:
    needs:
      - prepare
      - benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      PROFILE: ${{ needs.prepare.outputs.profile }}

    steps:
      - name: Require a complete eligible performance run
        shell: bash
        env:
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          GATE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'performance-ab') }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GATE_REQUESTED" != "true" ]]; then
            echo "PERFORMANCE_GATE_ENABLED=false" >> "$GITHUB_ENV"
            echo "Performance A/B was not requested for this pull request."
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo "::error::The trusted performance gate cannot execute candidate code from a fork"
            exit 1
          fi
          if [[ "$PREPARE_RESULT" != "success" || "$BENCHMARK_RESULT" != "success" ]]; then
            echo "::error::Performance preparation or one of the eight measurement shards failed"
            exit 1
          fi
          echo "PERFORMANCE_GATE_ENABLED=true" >> "$GITHUB_ENV"

      - name: Check out a fresh base-owned decision gate
        if: env.PERFORMANCE_GATE_ENABLED == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Check out candidate only for a fresh protected-path comparison
        if: env.PERFORMANCE_GATE_ENABLED == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        if: env.PERFORMANCE_GATE_ENABLED == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download immutable benchmark inputs
        if: env.PERFORMANCE_GATE_ENABLED == 'true'
        uses: actions/download-artifact@v8
        with:
          name: performance-ab-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results

      - name: Download isolated runner-local evidence
        if: env.PERFORMANCE_GATE_ENABLED == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: performance-ab-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: perf-shards
          merge-multiple: false

      - name: Re-verify revisions and the protected decision surface
        if: env.PERFORMANCE_GATE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 base/perf/ab/verify_protected.py \
            --base-dir base \
            --candidate-dir candidate \
            --config base/perf/ab/gate-config.json \
            --report perf-results/protected-paths.json
          python3 -m unittest discover -s base/perf/ab/tests -v

      - name: Merge and verify the complete shard set
        if: env.PERFORMANCE_GATE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t AA_MANIFESTS < <(
            find perf-shards -path '*/aa/run-manifest.json' -type f | sort
          )
          mapfile -t AB_MANIFESTS < <(
            find perf-shards -path '*/ab/run-manifest.json' -type f | sort
          )
          if [[ "${#AA_MANIFESTS[@]}" -ne 8 || "${#AB_MANIFESTS[@]}" -ne 8 ]]; then
            echo "::error::Expected exactly 8 A/A and 8 A/B shard manifests"
            exit 1
          fi

          AA_ARGS=()
          for manifest in "${AA_MANIFESTS[@]}"; do
            AA_ARGS+=(--manifest "$manifest")
          done
          python3 base/perf/ab/merge_manifests.py \
            "${AA_ARGS[@]}" \
            --output-dir perf-results/aa

          AB_ARGS=()
          for manifest in "${AB_MANIFESTS[@]}"; do
            AB_ARGS+=(--manifest "$manifest")
          done
          python3 base/perf/ab/merge_manifests.py \
            "${AB_ARGS[@]}" \
            --output-dir perf-results/ab \
            --peer-manifest perf-results/aa/run-manifest.json

          mkdir -p perf-results/shards
          for index in "${!AA_MANIFESTS[@]}"; do
            printf -v shard '%02d' "$index"
            cp "${AA_MANIFESTS[$index]}" "perf-results/shards/aa-$shard-run-manifest.json"
            cp "${AB_MANIFESTS[$index]}" "perf-results/shards/ab-$shard-run-manifest.json"
            chmod 0444 \
              "perf-results/shards/aa-$shard-run-manifest.json" \
              "perf-results/shards/ab-$shard-run-manifest.json"
          done

      - name: Decide from fresh base-owned thresholds
        if: env.PERFORMANCE_GATE_ENABLED == 'true'
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          python3 base/perf/ab/gate.py \
            --config base/perf/ab/gate-config.json \
            --profile "$PROFILE" \
            --aa-manifest perf-results/aa/run-manifest.json \
            --ab-manifest perf-results/ab/run-manifest.json \
            --output-dir perf-results
          cat perf-results/decision.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write artifact manifest
        if: always() && env.PERFORMANCE_GATE_ENABLED == 'true'
        shell: bash
        run: |
          python3 base/perf/ab/artifact_manifest.py \
            --root perf-results \
            --output perf-results/artifact-manifest.json \
            --base-sha "$BASE_SHA" \
            --candidate-sha "$CANDIDATE_SHA"

      - name: Upload raw and analyzed evidence
        if: always() && env.PERFORMANCE_GATE_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: performance-ab-${{ env.PROFILE }}-${{ env.BASE_SHA }}-${{ env.CANDIDATE_SHA }}
          path: perf-results/**
          if-no-files-found: error
          retention-days: 30

      - name: Enforce three-state decision
        if: always() && env.PERFORMANCE_GATE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.decision.outcome }}" = "success"
          STATE="$(python3 -c 'import json; print(json.load(open("perf-results/decision.json", encoding="utf-8"))["state"])')"
          if [[ "$STATE" != "PASS_OPTIMIZED" ]]; then
            echo "Performance gate did not pass: $STATE"
            exit 1
          fi
