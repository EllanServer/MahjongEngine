name: Release 2.0

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v2.x.y tag to republish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Require the official rule-pack trust root
        shell: bash
        env:
          RULE_PACK_PUBLIC_KEY: ${{ vars.MAHJONG_RULE_PACK_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RULE_PACK_PUBLIC_KEY"
          printf '%s' "$RULE_PACK_PUBLIC_KEY" | base64 --decode > rule-pack-public-key.der
          openssl pkey -pubin -inform DER -in rule-pack-public-key.der -noout
      - name: Validate immutable release version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n 1)"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          [[ "$VERSION" =~ ^2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION" != *SNAPSHOT* ]]
          [[ "$TAG" = "v$VERSION" ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify and build once
        run: ./gradlew clean check :mahjong-plugin:shadowJar --no-daemon --stacktrace
        env:
          MAHJONG_RULE_PACK_PUBLIC_KEY_BASE64: ${{ vars.MAHJONG_RULE_PACK_PUBLIC_KEY_BASE64 }}
      - name: Select release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find modules/mahjong-plugin/build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
      - name: Verify embedded trust root
        shell: bash
        env:
          RULE_PACK_PUBLIC_KEY: ${{ vars.MAHJONG_RULE_PACK_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          EMBEDDED="$(unzip -p '${{ steps.artifact.outputs.jar }}' META-INF/mahjong-rule-trust-root.txt | tr -d '\r\n')"
          test "$EMBEDDED" = "$RULE_PACK_PUBLIC_KEY"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.jar }}
