header.title=MahjongPaper configuration
header.snapshot=The plugin loads this file at startup and again when /mahjong reload succeeds.
header.restart=Use /mahjong reload for ordinary settings; restart after changing the JAR, Java/Paper/CraftEngine, or InvSync backend/fallback.
header.compat=Grouped keys are preferred; legacy flat keys are still accepted for compatibility.

rules.enabled=Enable restart-scoped installation and loading of signed official rule packs.
rules.registry=HTTPS URL of the signed registry.json GitHub Release asset. Leave blank until publishing is configured.

database.enabled=Set false to disable persistence.
database.fail_on_error=If true, plugin startup fails when database initialization fails.
database.type=Supported values: h2, mariadb, mysql
database.host=Used only for MariaDB and MySQL.
database.parameters=Extra JDBC query parameters for MariaDB and MySQL.
database.credentials=Used only for MariaDB and MySQL.
database.h2.path=Relative paths are resolved against the plugin data folder.

tables.batch=How many persistent tables are rebuilt per tick after startup.
tables.free_move=Allow players to move freely during a round without being treated as leaving.
tables.persistence=Restore persistent table location and rule metadata at startup; active hands and walls are not resumed.
tables.overhead_enabled=Show the right-side river-view control and enable its client-only overhead camera.
tables.overhead_height=Height of the overhead camera anchor above the table center (3.0 to 6.0 blocks, capped so the return control remains reachable).
tables.overhead_transition=Camera transition duration in ticks (1 to 40).

gameroom.summary=Game rooms are spatial containers for mahjong tables. When enabled, tables can only be created inside a game room.
gameroom.enabled=Enable the game room system. When disabled, tables can be created anywhere.
gameroom.restrict=When true, new tables can only be created inside a game room. Existing tables outside rooms remain functional.
gameroom.messages=Show enter/exit messages when players cross game room boundaries.
gameroom.countdown=Seconds before a match is force-ended when an active player leaves the game room. Minimum 5 seconds.
gameroom.radius=Default radius (blocks) when creating a game room from a center point.
gameroom.height=Default height (blocks) when creating a game room from a center point.
gameroom.file=File name for game room persistence, relative to the plugin data folder.

ranking.summary=Mahjong Soul-style rank points. InvSync may own player profiles; SQL remains required for global history and leaderboard projection.
ranking.rooms=Supported room presets: BRONZE, SILVER, GOLD, JADE, THRONE
ranking.invsync=Use InvSync 2.x as the authoritative online player rank store when the optional plugin is compatible. Enable InvSync auto-save and world-save.
ranking.invsync_fallback=Automatically keep the existing database rank backend when InvSync is absent, disabled, or API-incompatible.

craftengine.export=Export bundled MahjongPaper CraftEngine assets on startup.
craftengine.compat=Inject anti-cheat PacketEvents mappings when compatible integrations are present.
craftengine.prefer_custom=Prefer CraftEngine custom items for tile visuals.
craftengine.tile_prefix=Shared fallback item id prefix. MahjongPaper appends lowercase tile names automatically.
craftengine.riichi_prefix=Item id prefix override for Riichi tables.
craftengine.gb_prefix=Item id prefix override for GB tables.
craftengine.fallback_unknown=If a front-face item id is missing, MahjongPaper falls back to the variant's unknown tile item.
craftengine.prefer_hitbox=Prefer CraftEngine furniture hitboxes for table and seat interaction.
craftengine.table_furniture=Furniture id for table visual. Set empty string to use built-in fallback.
craftengine.seat_furniture=Furniture id for seat visual. Set empty string to use built-in fallback.

debug.categories=Empty list means all categories when debug is enabled.
