header.title=MahjongPaper 配置文件
header.snapshot=插件会在启动时读取本文件，也会在 /mahjong reload 成功时重新加载。
header.restart=普通设置可用 /mahjong reload；更换 JAR、Java/Paper/CraftEngine 或 InvSync backend/回退策略后需完整重启。
header.compat=推荐使用分组键名；旧版扁平键名仍保留兼容。

database.enabled=设为 false 可关闭持久化。
database.fail_on_error=若为 true，数据库初始化失败会导致插件启动失败。
database.type=支持值: h2, mariadb, mysql
database.host=仅用于 MariaDB / MySQL。
database.parameters=MariaDB / MySQL 的额外 JDBC 参数。
database.credentials=仅用于 MariaDB / MySQL。
database.h2.path=相对路径会基于插件数据目录解析。

tables.batch=服务器启动后，每 tick 重建的持久化牌桌数量。
tables.free_move=允许玩家在对局中自由移动且不被视为离桌。
tables.persistence=启动时恢复持久化牌桌的位置和规则元数据；不恢复进行中的手牌或牌墙。
tables.overhead_enabled=显示右侧“看牌河”按钮，并启用仅客户端可见的俯视相机。
tables.overhead_height=俯视相机锚点高于牌桌中心的高度（3.0 至 6.0 格；上限用于确保“返回座位”仍可点击）。
tables.overhead_transition=相机进入俯视的过渡时长（1 至 40 tick）。

gameroom.summary=棋牌室是牌桌的空间容器。启用后，牌桌只能在棋牌室内创建。
gameroom.enabled=启用棋牌室系统。禁用后，牌桌可以在任意位置创建。
gameroom.restrict=为 true 时，新牌桌只能在棋牌室内创建。棋牌室外的已有牌桌仍可正常使用。
gameroom.messages=玩家进出棋牌室时显示提示消息。
gameroom.countdown=对局中玩家离开棋牌室后，强制结束对局的倒计时秒数。最小 5 秒。
gameroom.radius=以中心点创建棋牌室时的默认半径（方块数）。
gameroom.height=以中心点创建棋牌室时的默认高度（方块数）。
gameroom.file=棋牌室持久化文件名，相对于插件数据目录。

ranking.summary=雀魂风格段位分。InvSync 可接管玩家主档；全局局史与排行榜投影仍需数据库。
ranking.rooms=支持房间预设: BRONZE, SILVER, GOLD, JADE, THRONE
ranking.invsync=可选安装兼容的 InvSync 2.x 后，将其作为在线玩家段位数据的唯一主存储。必须在 InvSync 中开启自动保存与世界保存。
ranking.invsync_fallback=InvSync 缺失、未启用或 API 不兼容时，自动完整回退现有数据库段位存储。

craftengine.export=启动时导出内置的 CraftEngine 资源包。
craftengine.compat=在兼容环境下注入反作弊 PacketEvents 映射。
craftengine.prefer_custom=优先使用 CraftEngine 自定义物品显示牌面。
craftengine.tile_prefix=共享前缀，插件会自动拼接小写牌名。
craftengine.riichi_prefix=日麻牌桌的前缀覆盖。
craftengine.gb_prefix=国标牌桌的前缀覆盖。
craftengine.fallback_unknown=若正面物品缺失，自动回退到该规则集的 unknown 物品。
craftengine.prefer_hitbox=优先使用 CraftEngine 家具 hitbox 进行交互。
craftengine.table_furniture=牌桌家具 id，留空则使用内置回退。
craftengine.seat_furniture=座椅家具 id，留空则使用内置回退。

debug.categories=为空时表示开启 debug 后输出所有分类。
rules.enabled=Enable signed official rule-pack loading after a full restart.
rules.registry=HTTPS URL of the signed registry.json release asset; leave blank until publishing is configured.
