header.title=MahjongPaper 設定檔
header.snapshot=外掛會在啟動時讀取本檔案，也會在 /mahjong reload 成功時重新載入。
header.restart=一般設定可用 /mahjong reload；更換 JAR、Java/Paper/CraftEngine 或 InvSync backend/回退策略後需完整重啟。
header.compat=建議使用分組鍵名；舊版扁平鍵名仍保留相容。

database.enabled=設為 false 可關閉持久化。
database.fail_on_error=若為 true，資料庫初始化失敗會導致外掛啟動失敗。
database.type=支援值: h2, mariadb, mysql
database.host=僅用於 MariaDB / MySQL。
database.parameters=MariaDB / MySQL 的額外 JDBC 參數。
database.credentials=僅用於 MariaDB / MySQL。
database.h2.path=相對路徑會以外掛資料夾為基準解析。

tables.batch=伺服器啟動後，每 tick 重建的持久化牌桌數量。
tables.free_move=允許玩家在對局中自由移動且不視為離桌。
tables.persistence=啟動時還原持久化牌桌的位置與規則中繼資料；不還原進行中的手牌或牌牆。
tables.overhead_enabled=顯示右側「看牌河」按鈕，並啟用僅客戶端可見的俯視相機。
tables.overhead_height=俯視相機錨點高於牌桌中心的高度（3.0 至 6.0 格；上限用於確保「返回座位」仍可點擊）。
tables.overhead_transition=相機進入俯視的過渡時長（1 至 40 tick）。

gameroom.summary=棋牌室是牌桌的空間容器。啟用後，牌桌只能在棋牌室內建立。
gameroom.enabled=啟用棋牌室系統。停用後，牌桌可以在任意位置建立。
gameroom.restrict=為 true 時，新牌桌只能在棋牌室內建立。棋牌室外的已有牌桌仍可正常使用。
gameroom.messages=玩家進出棋牌室時顯示提示訊息。
gameroom.countdown=對局中玩家離開棋牌室後，強制結束對局的倒數計時秒數。最小 5 秒。
gameroom.radius=以中心點建立棋牌室時的預設半徑（方塊數）。
gameroom.height=以中心點建立棋牌室時的預設高度（方塊數）。
gameroom.file=棋牌室持久化檔案名稱，相對於外掛資料夾。

ranking.summary=雀魂風格段位分。InvSync 可接管玩家主檔；全域局史與排行榜投影仍需資料庫。
ranking.rooms=支援房間預設: BRONZE, SILVER, GOLD, JADE, THRONE
ranking.invsync=可選安裝相容的 InvSync 2.x 後，將其作為線上玩家段位資料的唯一主儲存。必須在 InvSync 開啟自動儲存與世界儲存。
ranking.invsync_fallback=InvSync 缺少、未啟用或 API 不相容時，自動完整回退既有資料庫段位儲存。

craftengine.export=啟動時匯出內建 CraftEngine 資源包。
craftengine.compat=在相容環境下注入反作弊 PacketEvents 映射。
craftengine.prefer_custom=優先使用 CraftEngine 自訂物品顯示牌面。
craftengine.tile_prefix=共用前綴，外掛會自動拼接小寫牌名。
craftengine.riichi_prefix=日麻牌桌的前綴覆寫。
craftengine.gb_prefix=國標牌桌的前綴覆寫。
craftengine.fallback_unknown=若正面物品缺失，會自動回退至該規則集的 unknown 物品。
craftengine.prefer_hitbox=優先使用 CraftEngine 家具 hitbox 互動。
craftengine.table_furniture=牌桌家具 id，留空則使用內建回退。
craftengine.seat_furniture=座椅家具 id，留空則使用內建回退。

debug.categories=留空表示啟用 debug 後輸出所有分類。
rules.enabled=Enable signed official rule-pack loading after a full restart.
rules.registry=HTTPS URL of the signed registry.json release asset; leave blank until publishing is configured.
