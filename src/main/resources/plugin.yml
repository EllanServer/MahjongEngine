name: MahjongPaper
main: top.ellan.mahjong.bootstrap.MahjongPaperPlugin
version: ${version}
api-version: "${paperApiVersion}"
folia-supported: true
author: openai and ellan
website: top.ellan
description: CraftEngine-first Mahjong platform with restart-scoped signed rule packs.
depend:
  - CraftEngine
softdepend:
  - InvSync
  - WorldGuard
  - Kingdoms
  - Lands
  - IridiumSkyblock
  - CrashClaim
  - GriefDefender
  - HuskClaims
  - BentoBox
  - HuskTowns
  - PlotSquared
  - Residence
  - SuperiorSkyblock2
  - Towny
  - FabledSkyBlock
  - GriefPrevention
  - RedProtect
  - Landlord
  - uSkyBlock
  - XClaim
  - UltimateClaims
  - UltimateClans
  - PreciousStones
  - Dominion
  - Factions
  - NoBuildPlus
  - Protect
  - SimpleClaimSystem
  - LandClaimPlugin
commands:
  mahjong:
    description: Manage MahjongPaper tables and rounds. Use /mahjong help for command explanations.
    usage: /mahjong <help|create|botmatch|mode|join|leave|list|spectate|unspectate|table|addbot|removebot|rule|rules|start|state|riichi|tsumo|ron|pon|minkan|chii|kan|skip|kyuushu|settlement|rank|leaderboard|render|inspect|clear|forceend|deletetable|reload>
    permission: mahjongpaper.command
permissions:
  mahjongpaper.command:
    default: true
  mahjongpaper.admin:
    default: op
