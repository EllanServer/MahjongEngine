command.help.create=<gray>/mahjong create</gray> <white>- 現在地に新しい卓を作成します。</white>
command.help.botmatch=<gray>/mahjong botmatch [hanchan|tonpuu]</gray> <white>- 4人のボット対局を作成して開始し、観戦します。</white>
command.help.mode=<gray>/mahjong mode <MAJSOUL_TONPUU|MAJSOUL_HANCHAN|GB|SICHUAN></gray> <white>- ルールセットを適用します。雀魂式リーチ麻雀が主モードで、国標麻雀と四川麻雀も選べます。</white>
command.help.join=<gray>/mahjong join <table_id></gray> <white>- プレイヤーとして卓に参加します。</white>
command.help.leave=<gray>/mahjong leave</gray> <white>- 現在の卓から退出するか、観戦を終了します。</white>
command.help.list=<gray>/mahjong list</gray> <white>- 稼働中の卓と場所を表示します。</white>
command.help.spectate=<gray>/mahjong spectate <table_id></gray> <white>- 着席せずに卓を観戦します。</white>
command.help.unspectate=<gray>/mahjong unspectate</gray> <white>- 現在の卓の観戦を終了します。</white>
command.help.addbot=<gray>/mahjong addbot</gray> <white>- 空席を1つボットで埋めます。</white>
command.help.removebot=<gray>/mahjong removebot</gray> <white>- 局の開始前にボットを1人外します。</white>
command.help.rule=<gray>/mahjong rule [key] [value]</gray> <white>- ルール画面を開くか、開始前のルールを変更します。</white>
command.help.rules=<gray>/mahjong rules <list|install|update|verify|activate|gc></gray> <white>- 署名済み公式ルールパックを管理します（管理者）。</white>
command.help.start=<gray>/mahjong start</gray> <white>- 準備状態を切り替えます。4人全員が準備すると自動で開始します。</white>
command.help.state=<gray>/mahjong state</gray> <white>- 卓と現在局の状態を表示します。</white>
command.help.riichi=<gray>/mahjong riichi <hand_index></gray> <white>- 指定した手牌を切ってリーチを宣言します。リーチ麻雀専用です。</white>
command.help.tsumo=<gray>/mahjong tsumo</gray> <white>- ツモ和了できる手牌ならツモを宣言します。</white>
command.help.ron=<gray>/mahjong ron</gray> <white>- 他家の捨て牌でロンを宣言します。</white>
command.help.pon=<gray>/mahjong pon</gray> <white>- 現在の応答受付でポンを宣言します。</white>
command.help.minkan=<gray>/mahjong minkan</gray> <white>- 現在の応答受付で大明槓を宣言します。</white>
command.help.chii=<gray>/mahjong chii <tile_a> <tile_b></gray> <white>- 手牌の2牌を指定してチーを宣言します。</white>
command.help.kan=<gray>/mahjong kan <tile></gray> <white>- 指定した牌種で暗槓または加槓を宣言します。</white>
command.help.skip=<gray>/mahjong skip</gray> <white>- 現在の応答機会を見送ります。</white>
command.help.kyuushu=<gray>/mahjong kyuushu</gray> <white>- 九種九牌による途中流局を宣言します。リーチ麻雀専用です。</white>
command.help.settlement=<gray>/mahjong settlement</gray> <white>- この卓の直近の精算画面を再表示します。</white>
command.help.rank=<gray>/mahjong rank</gray> <white>- 雀魂式の段位進行を表示します。</white>
command.help.render=<gray>/mahjong render</gray> <white>- 卓の表示を強制更新します。</white>
command.help.inspect=<gray>/mahjong inspect</gray> <white>- 個人用デバッグ粒子で表示基準点と棒の向きを確認します。</white>
command.help.clear=<gray>/mahjong clear</gray> <white>- 現在の卓の表示エンティティを消去します。</white>
command.help.forceend=<gray>/mahjong forceend [table_id]</gray> <white>- 管理者用: 対局を強制終了して卓を待機状態に戻します。</white>
command.help.deletetable=<gray>/mahjong deletetable [table_id]</gray> <white>- 管理者用: 現在または指定した卓を直ちに削除します。</white>
